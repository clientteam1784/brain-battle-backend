name: Python backend CI

on:
  pull_request:
    paths:
      - "python-backend/**"
      - "docs/FRONTEND_API_GUIDE.md"
      - "docs/openapi.json"
      - ".github/workflows/python-backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "python-backend/**"
      - "docs/FRONTEND_API_GUIDE.md"
      - "docs/openapi.json"
      - ".github/workflows/python-backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-backend/pyproject.toml
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app --cov-fail-under=85
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- ../docs/openapi.json
