name: Python backend CI

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "Dockerfile"
      - ".python-version"
      - ".github/workflows/python-backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tests/**"
      - "migrations/**"
      - "scripts/**"
      - "docs/**"
      - "pyproject.toml"
      - "uv.lock"
      - "alembic.ini"
      - "Dockerfile"
      - ".python-version"
      - ".github/workflows/python-backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install uv
      - run: uv sync --locked --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app --cov-fail-under=85
      - run: uv run python scripts/export_openapi.py
      - run: git diff --exit-code -- docs/openapi.json
